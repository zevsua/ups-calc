name: Збірка APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename
        run: cp app/build/outputs/apk/release/app-release.apk Kalkulyator-DBZh.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Kalkulyator-DBZh-apk
          path: Kalkulyator-DBZh.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Калькулятор ДБЖ 1.${{ github.run_number }}
          body: Завантажте Kalkulyator-DBZh.apk нижче і встановіть на телефон.
          files: Kalkulyator-DBZh.apk
          make_latest: true
